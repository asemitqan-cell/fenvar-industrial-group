let r=await sb.from('hz_conversations').select('*').eq('listing_id',lid).eq('buyer_id',user.id).maybeSingle(),c=r.data;
if(!c){const n=await sb.from('hz_conversations').insert({listing_id:lid,listing_title:l.title,buyer_id:user.id,seller_id:l.owner}).select().single();if(n.error){alert(L('Could not start the chat. Try again.','معرفناش نفتح المحادثة. جرّب تاني.'));return}c=n.data}
showStore('chat',c.id)}

/* add listing wizard */
function shrink(f){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cv.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej()},'image/jpeg',.8)};im.onerror=rej;im.src=u})}
const qHTML=q=>`<label><span>${L(q[1],q[2])}</span>${q[3]==='s'?`<select name="a_${q[0]}" required><option value="">—</option>${q[4].map(o=>`<option value="${esc(o[0])}">${L(o[0],o[1])}</option>`).join('')}</select>`:`<input name="a_${q[0]}" ${q[3]==='n'?'type="number" min="0" inputmode="numeric"':''} maxlength="80">`}</label>`;
function drawPh(){const e=$('#adPh');if(e)e.innerHTML=ad.files.map((f,i)=>`<div class="pht">${f.type.startsWith('video/')?`<video src="${URL.createObjectURL(f)}" muted playsinline></video>`:`<img src="${URL.createObjectURL(f)}" alt="">`}<button type="button" data-rp="${i}">×</button></div>`).join('')}
function renderAdd(){const b=$('#stBody');if(!ad)ad={kind:null,cat:null,files:[]};let h=stHead();
if(!ad.kind){b.innerHTML=h+`<p class="tag">${L('What do you want to add?','عايز تضيف إيه؟')}</p><button class="row" data-ak="product">${L('A product I want to sell','منتج عايز أبيعه')}</button><button class="row" data-ak="service">${L('A service I offer','خدمة بقدّمها')}</button>`;return}
if(!ad.cat){b.innerHTML=h+`<button class="pill" data-ab>${L('← Back','← رجوع')}</button><p class="tag" style="margin-top:12px">${L('Pick the section that fits best','اختار القسم الأنسب')}</p><div class="cgrid">${CAT_FOR[ad.kind].map(id=>{const c=CATALOG.find(x=>x.id===id);return c?`<button class="pillc" data-ac="${id}" style="--a:${c.c[0]}">${ico(id)}<span>${N(c)}</span></button>`:''}).join('')}</div>`;return}
const qs=FORMS[ad.kind][ad.cat]||[],sv=ad.kind==='service';
b.innerHTML=h+`<button class="pill" data-ab>${L('← Back','← رجوع')}</button><h4 style="margin:12px 0 8px">${esc(catName(ad.cat))} · ${sv?L('Service','خدمة'):L('Product','منتج')}</h4><form id="adForm"><label><span>${sv?L('Service title','اسم الخدمة'):L('Title','عنوان الإعلان')}</span><input name="title" required maxlength="80"></label>${qs.map(qHTML).join('')}<label><span>${sv?L('Service details (what you do, how you work)','تفاصيل الخدمة (بتعمل إيه وإزاي)'):L('Description (optional)','وصف (اختياري)')}</span><textarea name="desc" rows="4" maxlength="1500" ${sv?'required':''}></textarea></label><div class="two"><label><span>${sv?L('Price from (optional)','السعر يبدأ من (اختياري)'):L('Price','السعر')}</span><input name="price" type="number" min="0" step="any" inputmode="decimal"></label><label><span>${L('Currency','العملة')}</span><select name="cur"><option>EGP</option><option>USD</option><option>EUR</option><option>SAR</option><option>AED</option></select></label></div><label><span>${L('City / area','المدينة / المنطقة')}</span><input name="city" maxlength="60"></label><div id="adPh" class="ph3"></div><label class="phbtn">${sv?L('+ Add photos, GIF or a short video (optional)','+ ضيف صور أو GIF أو فيديو قصير (اختياري)'):L('+ Add photos, GIF or a short video (up to 4)','+ ضيف صور أو GIF أو فيديو قصير (لحد 4)')}<input id="adFiles" class="fi" type="file" accept="image/*,video/mp4,video/webm,video/quicktime" multiple></label><label><span>${L('Your name','اسمك')}</span><input name="fname" required maxlength="60" value="${esc(PROF&&PROF.full_name||'')}"></label><label><span>${L('Phone / WhatsApp','رقم التليفون / واتساب')}</span><input name="fphone" type="tel" required maxlength="25" value="${esc(PROF&&PROF.phone||'')}"></label><p class="msg" id="adMsg"></p><button class="btn" id="adGo">${L('Send for review','ابعت للمراجعة')}</button></form>`;
drawPh();$('#adFiles').onchange=async e=>{for(const f of e.target.files){if(ad.files.length>=4)break;try{if(f.type.startsWith('video/')){if(f.size>12e6||ad.files.some(x=>x.type.startsWith('video/'))){alert(L('One short video up to 12MB.','فيديو واحد قصير لحد 12 ميجا.'));continue}ad.files.push(f)}else if(f.type==='image/gif'&&f.size<3.5e6)ad.files.push(f);else ad.files.push(await shrink(f))}catch(_){}}e.target.value='';drawPh()};
$('#adForm').onsubmit=submitAd}
async function submitAd(e){e.preventDefault();const fm=new FormData(e.target),m=$('#adMsg'),go=$('#adGo'),qs=FORMS[ad.kind][ad.cat]||[];m.className='msg';m.textContent='';
if(ad.kind==='product'&&!ad.files.length){m.textContent=L('Add at least one photo.','ضيف صورة واحدة على الأقل.');return}
go.disabled=true;go.textContent='…';
try{const attrs={},sm=[];qs.forEach(q=>{const v=String(fm.get('a_'+q[0])||'').trim();if(!v)return;attrs[q[0]]=v;const o=(q[4]||[]).find(x=>x[0]===v);sm.push(q[2]+': '+(o?o[1]:v))});
const urls=[];for(let i=0;i<ad.files.length;i++){const bl=ad.files[i],ex=bl.type==='image/gif'?'gif':bl.type==='video/mp4'?'mp4':bl.type==='video/webm'?'webm':bl.type==='video/quicktime'?'mov':'jpg',p=`${user.id}/${Date.now()}_${i}.${ex}`,u=await sb.storage.from('listings').upload(p,bl,{contentType:bl.type||'image/jpeg'});if(u.error)throw u.error;urls.push(sb.storage.from('listings').getPublicUrl(p).data.publicUrl)}
const pr=String(fm.get('price')||'').trim();
await sb.from('hz_profiles').upsert({id:user.id,email:user.email,full_name:String(fm.get('fname')).trim(),phone:String(fm.get('fphone')).trim()});await loadProf();
const r=await sb.from('hz_listings').insert({owner:user.id,kind:ad.kind,cat:ad.cat,title:String(fm.get('title')).trim(),description:String(fm.get('desc')||'').trim(),price:pr===''?null:+pr,currency:fm.get('cur'),city:String(fm.get('city')||'').trim(),attrs,summary:sm.join(' · '),photos:urls,status:'pending'});
if(r.error)throw r.error;ad=null;stTab='items';stFlash=L('Sent for review. It will appear after approval.','اتبعت للمراجعة. هيظهر بعد موافقة الإدارة.');renderStore()}
catch(err){go.disabled=false;go.textContent=L('Send for review','ابعت للمراجعة');m.textContent=L('Could not send. Try again.','مقدرناش نبعت. جرّب تاني.')+' ['+(err.message||'error')+']'}}

document.addEventListener('click',async e=>{const t=e.target;let x;
if(x=t.closest('[data-msg]')){openChat(x.dataset.msg);return}
if(x=t.closest('[data-st]')){stTab=x.dataset.st;stFlash='';if(stTab==='add')ad=null;renderStore();return}
if(x=t.closest('[data-conv]')){curConv=x.dataset.conv;stTab='chat';renderStore();return}
if(x=t.closest('[data-del]')){if(confirm(L('Delete this listing?','تمسح الإعلان ده؟'))){await sb.from('hz_listings').delete().eq('id',x.dataset.del);renderStore();loadUL()}return}
if(x=t.closest('[data-ak]')){ad.kind=x.dataset.ak;renderAdd();return}
if(x=t.closest('[data-ac]')){ad.cat=x.dataset.ac;renderAdd();return}
if(t.closest('[data-ab]')){if(ad.cat)ad.cat=null;else ad.kind=null;renderAdd();return}
if(x=t.closest('[data-rp]')){ad.files.splice(+x.dataset.rp,1);drawPh()}});
$('#barStore').onclick=()=>showStore('items');
const _sy=window.syncUI;window.syncUI=function(){_sy();$('#barStore').hidden=!user};
if(sb)sb.auth.onAuthStateChange((_,s)=>{setTimeout(async()=>{if(s&&s.user){await loadProf();pollUnread();if(pendingChat){const p=pendingChat;pendingChat=null;openChat(p)}}else{PROF=null;$('#barStore').classList.remove('un')}syncUI()},0)});
loadUL();


(function(){const el=$('#slides');if(!el)return;let hold=0;['touchstart','mousedown','wheel','pointerdown'].forEach(ev=>el.addEventListener(ev,()=>hold=Date.now()+7000,{passive:true}));
setInterval(()=>{if(Date.now()<hold||document.hidden)return;const s=el.querySelector('.sl');if(!s)return;const w=s.offsetWidth+10,max=el.scrollWidth-el.clientWidth,rtl=getComputedStyle(el).direction==='rtl',pos=Math.abs(el.scrollLeft);if(pos>=max-4)el.scrollTo({left:0,behavior:'smooth'});else el.scrollBy({left:(rtl?-1:1)*w,behavior:'smooth'})},3800)})();
applyLang();
