$('#authForm').addEventListener('submit',async e=>{e.preventDefault();const m=$('#authMsg');m.className='msg';m.textContent='…';if(!sb){m.textContent=L('Connection error','مشكلة في الاتصال');return}

close();e.target.reset()});
$('#reqForm').addEventListener('submit',async e=>{e.preventDefault();const m=$('#reqMsg');m.className='msg';m.textContent='…';const d=Object.fromEntries(new FormData(e.target).entries());
const it=e.target.dataset.item;d.email=user.email;d.interest={upvc:'Windows & Doors',glass:'Glass Solutions'}[reqCat]||'Architectural Solutions';d.message='['+it+'] '+(d.message||'');

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let nOn=(()=>{try{return localStorage.getItem('fv_notif')!=='0'}catch(_){return true}})(),att=null;
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('fv_theme',t)}catch(_){}document.querySelector('meta[name=theme-color]').content=t==='dark'?'#0B1416':'#0F766E';if(window.syncUI)syncUI()}
function setLang(l){lang=l;try{localStorage.setItem('fv_lang',l)}catch(_){}$('#langMenu').hidden=true;applyLang()}
function openSettings(){setBar('barAuth');open('#accModal')}
function setBar(id){document.querySelectorAll('.bar button').forEach(b=>b.classList.toggle('on',b.id===id))}
function renderTrend(){const ids=['furniture','glass','upvc','wood','offers'];$('#slides').innerHTML=ids.map(i=>CATALOG.find(c=>c.id===i)).filter(Boolean).map(c=>`<div class="sl" data-c="${c.id}" style="background:${grad(c.c)}">${ico(c.id)}<small>${L('Trending','رائج','Im Trend')}</small><b>${N(c)}</b></div>`).join('')+`<div class="sl more" data-c="offers">${L('More','المزيد','Mehr')} <span>›</span></div>`}
window.syncUI=function(){const dk=document.documentElement.dataset.theme==='dark';$('#themeBtn').classList.toggle('dk',dk);$('#bellBtn').classList.toggle('off',!nOn);$('#setTheme').textContent=dk?L('Light mode','الوضع الفاتح'):L('Dark mode','الوضع الداكن');document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));$('#accEmail').textContent=user?user.email:'';$('#accIn').hidden=!!user;$('#outBtn').hidden=!user;renderTrend()};

setTheme((()=>{try{return localStorage.getItem('fv_theme')}catch(_){return null}})()||'light');

const route=q=>{q=q.toLowerCase();for(const k in RT)if(RT[k].split(' ').some(w=>w.length>2&&q.includes(w)))return k;return null};
function goCat(k){cat=k;typ=null;$('#q').value='';renderChips();render();$('#ai').hidden=true;window.scrollTo({top:$('#chips').offsetTop-100,behavior:'smooth'})}
let rec=null;

function toggleMic(){$('#plusMenu').hidden=true;$('#plus').classList.remove('open');const R=window.SpeechRecognition||window.webkitSpeechRecognition,a=$('#att');if(!R){a.textContent=L('Voice is not supported on this device','الصوت مش مدعوم على الجهاز ده');return}
if(rec){rec.stop();return}rec=new R();rec.lang={ar:'ar-EG',en:'en-US',de:'de-DE'}[lang];rec.interimResults=false;$('.sb').classList.add('rec');$('#aiGo').textContent='■';a.textContent=L('Listening…','بسمعك…','Ich höre zu…');

async function askAI(){if(rec){rec.stop();return}const q=$('#q').value.trim();if(!q&&!att)return;const k=route(q);if(k&&!att){goCat(k);return}
const b=$('#ai');b.hidden=false;b.innerHTML='<div class="dots"><i></i><i></i><i></i></div>';
try{const r=await fetch(SB_URL+'/functions/v1/fenvar-ai',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY},body:JSON.stringify({q,lang,image:att&&att.img||null,file:att&&att.name||null})});if(!r.ok)throw 0;const d=await r.json();b.textContent=d.answer||'';if(d.category&&CATALOG.some(c=>c.id===d.category)){const x=document.createElement('button');x.className='btn';x.textContent=L('Open section','افتح القسم','Bereich öffnen');x.onclick=()=>goCat(d.category);b.append(x)}}
catch(_){b.innerHTML=`<div>${L('Horizon AI is being connected. For now, send your request and our team will reply.','مساعد Horizon الذكي لسه بيتوصّل. ابعت طلبك دلوقتي وفريقنا هيرد عليك.','Die Horizon-KI wird gerade verbunden. Sende deine Anfrage, wir melden uns.')}</div><button class="btn alt" data-item="${(q||'Attachment').replace(/"/g,'')}" data-cat="">${L('Send request','ابعت طلب','Anfrage senden')}</button>`}}
$('#aiGo').onclick=askAI;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')askAI()});$('#q').addEventListener('input',()=>{if(!$('#q').value)$('#ai').hidden=true});

if(!e.target.closest('.menu,#plus,#langBtn')){$('#langMenu').hidden=true;$('#plusMenu').hidden=true;$('#plus').classList.remove('open')}});

(function(){let d='';const n=110;for(let i=0;i<n;i++){const r=Math.sqrt((i+.5)/n)*22,a=i*2.39996,t=i/n;d+=`<circle cx="${(24+r*Math.cos(a)).toFixed(1)}" cy="${(24+r*Math.sin(a)).toFixed(1)}" r="${(.5+t*1.1).toFixed(2)}" fill="hsl(${176-t*14} 72% ${46-t*24}%)" style="animation-delay:${(t*.8).toFixed(2)}s"/>`}$('#lgo').innerHTML=d;$('#wm').innerHTML='Horizon'.split('').map((c,i)=>`<span style="animation-delay:${.9+i*.13}s">${c}</span>`).join('')})();
