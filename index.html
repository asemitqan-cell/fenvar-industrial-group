$('#barSearch').onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});$('#q').focus()};
$('#barOffers').onclick=()=>{cat='offers';typ=null;renderChips();render();$('#grid').scrollIntoView({behavior:'smooth'})};
$('#outBtn').onclick=async()=>{await sb.auth.signOut();close()};
$('#notifBtn').onclick=async()=>{const m=$('#notifMsg');if(!('Notification' in window)){m.textContent=L('Not supported on this device.','الجهاز ده مش بيدعم الإشعارات.');return}const r=await Notification.requestPermission();m.className='msg '+(r==='granted'?'ok':'');m.textContent=r==='granted'?L('Enabled. Offers and news will reach you once the server side is connected.','اتفعّلت. العروض والجديد هيوصلوك أول ما نوصّل جهة السيرفر.'):L('Permission was not given.','مااتدّتش الصلاحية.')};
async function authBtn(){if(user){$('#accEmail').textContent=user.email;open('#accModal');return}authMode='in';authTexts();$('#authMsg').textContent='';open('#authModal')}
$('#authBtn').onclick=authBtn;$('#barAuth').onclick=authBtn;$('#authSwitch').onclick=()=>{authMode=authMode==='in'?'up':'in';authTexts();$('#authMsg').textContent=''};
$('#authForm').addEventListener('submit',async e=>{e.preventDefault();const m=$('#authMsg');m.className='msg';m.textContent='…';if(!sb){m.textContent=L('Connection error','مشكلة في الاتصال');return}
const f=new FormData(e.target),email=f.get('email'),password=f.get('password');
const r=authMode==='up'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
if(r.error){m.textContent=r.error.message;return}
if(authMode==='up'&&!r.data.session){m.className='msg ok';m.textContent=L('Check your email to confirm your account, then sign in.','افتح إيميلك وأكّد الحساب، وبعدين ادخل.');return}
close();e.target.reset()});
$('#reqForm').addEventListener('submit',async e=>{e.preventDefault();const m=$('#reqMsg');m.className='msg';m.textContent='…';const d=Object.fromEntries(new FormData(e.target).entries());
const it=e.target.dataset.item;d.email=user.email;d.interest={upvc:'Windows & Doors',glass:'Glass Solutions'}[reqCat]||'Architectural Solutions';d.message='['+it+'] '+(d.message||'');
try{const r=await fetch(SB_URL+'/functions/v1/fenvar-website-inquiry',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY},body:JSON.stringify(d)});if(!r.ok){let t='';try{t=(await r.text()).slice(0,140)}catch(_){}throw new Error(r.status+' '+t)}m.className='msg ok';m.textContent=L('Sent. We will contact you soon.','اتبعت. هنكلمك قريب.');e.target.reset();setTimeout(close,1600)}catch(err){m.textContent=L('Could not send. Try again.','مقدرناش نبعت. جرّب تاني.')+' ['+(err.message||'network')+']'}});
