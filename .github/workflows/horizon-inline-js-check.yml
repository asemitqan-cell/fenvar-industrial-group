name: Horizon inline JavaScript syntax
on:
  push:
    branches:
      - main
      - fix/horizon-public-provider-profiles
  pull_request:
    branches:
      - main
jobs:
  inline-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and validate inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.skip = False
                  self.parts = []
                  self.count = 0
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      a = dict(attrs)
                      self.active = "src" not in a
                      self.skip = a.get("type", "").lower() in ("application/ld+json", "application/json")
                      self.parts = []
              def handle_data(self, data):
                  if self.active and not self.skip:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.active:
                      code = "".join(self.parts)
                      if code.strip():
                          self.count += 1
                          Path(f"/tmp/horizon-inline-{self.count}.js").write_text(code, encoding="utf-8")
                      self.active = False
                      self.skip = False

          parser = Scripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          if not parser.count:
              raise SystemExit("No inline JavaScript blocks found")
          print(f"Extracted {parser.count} inline JavaScript blocks")
          PY
          for file in /tmp/horizon-inline-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Validate local JavaScript files
        shell: bash
        run: |
          shopt -s nullglob
          files=( *.js )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No local JavaScript files found"
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Checking $file"
            node --check "$file"
          done
