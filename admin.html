<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0F766E"><title>Horizon | لوحة الإدارة</title><link rel="manifest" href="admin.webmanifest?v=10"><link rel="icon" href="icon-admin.svg?v=10"><link rel="apple-touch-icon" href="hz-admin-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Horizon Admin">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}:root{--bg:#0B1416;--card:#12262A;--ink:#EAF4F3;--mut:#9DB3B1;--line:#21393D;--p:#14B8A6;--ok:#34D399;--no:#F87171;--wa:#F59E0B}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Arial,sans-serif;line-height:1.5;padding-bottom:40px}
button,input,select{font:inherit;color:inherit}a{color:var(--p);text-decoration:none}
.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(11,20,22,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}.brand b{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#0F766E,#071C20);display:grid;place-items:center}.brand svg{width:20px;height:20px}.brand small{display:block;font-size:11px;color:var(--mut);font-weight:600;margin-top:-4px}
.ghost{border:1px solid var(--line);background:none;border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--p);color:#042F2E}.btn.no{background:#7F1D1D;color:#fff}.btn.gh{background:none;border:1px solid var(--line);color:var(--ink)}.btn.sm{padding:7px 11px;font-size:13px}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.login{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}.login h2{margin:0 0 4px}.login p{color:var(--mut);margin:0 0 14px}
label{display:block;margin-bottom:10px;font-size:13px;color:var(--mut);font-weight:600}label input{display:block;width:100%;margin-top:4px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px}.login .btn{width:100%;padding:12px}
.msg{color:var(--no);min-height:20px;font-size:14px}
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px}.nav button{flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:8px 15px;font-weight:700;font-size:13px;cursor:pointer;color:var(--mut)}.nav button.on{background:var(--p);color:#042F2E;border-color:var(--p)}.nav i{font-style:normal;background:var(--no);color:#fff;border-radius:999px;padding:0 7px;margin-inline-start:6px;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.stat span{color:var(--mut);font-size:12px}.stat b{display:block;font-size:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.gal{display:flex;gap:4px;overflow-x:auto;background:#0006;min-height:120px}.gal img,.gal video{height:150px;width:auto;flex:none}textarea,select.f{display:block;width:100%;margin-top:4px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px}label select{display:block;width:100%;margin-top:4px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px}.pf{max-width:560px}.pv{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.pv img,.pv video{height:70px;border-radius:10px}.nop{padding:46px 0;text-align:center;color:var(--mut);width:100%}
.body{padding:12px 14px;display:flex;flex-direction:column;gap:6px}.row1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.row1 b{font-size:16px}
.meta{margin:0;color:var(--mut);font-size:13px}.desc{margin:0;font-size:14px;white-space:pre-wrap}.sm{margin:0;padding:0 18px 0 0;font-size:13px;color:var(--mut)}
.tag{font-size:11px;font-weight:800;border-radius:999px;padding:2px 10px;flex:none}.tag.pending{background:#78350F;color:#FDE68A}.tag.approved{background:#064E3B;color:#6EE7B7}.tag.rejected{background:#7F1D1D;color:#FECACA}
.who{border-top:1px dashed var(--line);padding-top:8px;font-size:13px;display:flex;flex-direction:column;gap:2px}.who a{margin-inline-end:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:13px}th,td{padding:10px;text-align:start;border-bottom:1px solid var(--line)}th{color:var(--mut);font-size:12px}.tw{overflow-x:auto}
.empty{text-align:center;color:var(--mut);padding:40px 0}.note{background:#78350F55;border:1px solid #92400E;border-radius:12px;padding:12px;font-size:13px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head><body>
<header class="top"><div class="brand"><b><svg viewBox="0 0 24 24"><path d="M6 16a6 6 0 0 1 12 0z" fill="#FBBF24"/><path d="M3 16h18" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M7 20h10" stroke="#5EEAD4" stroke-width="1.6" stroke-linecap="round"/></svg></b><span>Horizon<small>لوحة الإدارة</small></span></div><div><span id="me" style="font-size:12px;color:var(--mut)"></span> <button id="out" class="ghost" hidden>خروج</button></div></header>
<div class="wrap">
<form id="lf" class="login"><h2>دخول الإدارة</h2><p>سجّل دخول بحساب المدير.</p><label>الإيميل<input name="email" type="email" required autocomplete="username"></label><label>الباسورد<input name="password" type="password" required autocomplete="current-password"></label><p class="msg" id="lm"></p><button class="btn">دخول</button></form>
<div id="app" hidden><div class="nav" id="nav"></div><div id="v"></div></div>
</div>
<script>
const SB_URL='https://zxeykzxoxylfsdnaimwk.supabase.co',SB_KEY='sb_publishable_5i-jel2xo4kqyHz707aWsA_RTaJuZzx';
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY):null;
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CN={furniture:'غرف وموبيليا',wood:'خشب',glass:'زجاج',upvc:'UPVC',realestate:'عقارات',cars:'سيارات',food:'أكل ومطاعم',health:'صحة',learning:'كتب وتعلّم',events:'مناسبات',perfumes:'عطور',used:'مستعمل وخرده',livestock:'مواشي',translation:'ترجمة',news:'أخبار',services:'خدمات',consulting:'استشارات',offers:'عروض'};
const SN={pending:'بانتظار الموافقة',approved:'منشور',rejected:'مرفوض'};
let me=null,LS=[],PR={},view='over',fSt='all',fCat='all',fRole='all',leads=null;
const isVid=u=>/\.(mp4|webm|mov)(\?|$)/i.test(u||'');const med=u=>isVid(u)?`<a target="_blank" href="${esc(u)}"><video src="${esc(u)}" muted loop playsinline controls preload="metadata"></video></a>`:`<a target="_blank" href="${esc(u)}"><img src="${esc(u)}" alt=""></a>`;
function shrink(f){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej()},'image/jpeg',.8)};im.onerror=rej;im.src=u})}
function wa(p){let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='2'+d;return d}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#lm').textContent='…';if(!sb){$('#lm').textContent='مشكلة في الاتصال';return}const f=new FormData(e.target),r=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(r.error){$('#lm').textContent=r.error.message;return}enter(r.data.user)};
$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function enter(u){me=u;const a=await sb.from('hz_admins').select('user_id').eq('user_id',u.id).maybeSingle();
if(!a.data){await sb.auth.signOut();$('#lm').textContent='الحساب ده مش مدير. ضيفه في جدول admins من ملف SQL.';return}
$('#lf').hidden=true;$('#app').hidden=false;$('#out').hidden=false;$('#me').textContent=u.email;await load();draw()}
async function load(){const [a,b]=await Promise.all([sb.from('hz_listings').select('*').order('created_at',{ascending:false}).limit(1000),sb.from('hz_profiles').select('*').order('created_at',{ascending:false}).limit(2000)]);
if(a.error||b.error){$('#v').innerHTML='<div class="note">جداول قاعدة البيانات مش جاهزة. شغّل ملف horizon_setup.sql في Supabase الأول. ('+esc((a.error||b.error).message)+')</div>';LS=[];PR={};return}
LS=a.data;PR={};b.data.forEach(p=>PR[p.id]=p)}
function nav(){const pend=LS.filter(l=>l.status==='pending').length;$('#nav').innerHTML=[['over','نظرة عامة'],['pend','بانتظار الموافقة'+(pend?`<i>${pend}</i>`:'')],['all','كل الإعلانات'],['users','المستخدمين'],['post','+ منشور من الإدارة'],['leads','طلبات الموقع']].map(t=>`<button data-v="${t[0]}" class="${view===t[0]?'on':''}">${t[1]}</button>`).join('')}
function who(l){const p=PR[l.owner]||{};const w=wa(p.phone);return `<div class="who"><b>${esc(p.full_name||'—')}</b> <span style="color:var(--mut)">${p.role==='provider'?'مقدّم خدمة':'مستخدم'} · ${esc(p.email||'')}</span><div>${p.phone?`<a href="tel:${esc(p.phone)}">${esc(p.phone)}</a><a target="_blank" href="https://wa.me/${w}">واتساب</a>`:'<span style="color:var(--mut)">مفيش رقم</span>'}</div></div>`}
function card(l){const pr=l.price!=null?' · '+Number(l.price).toLocaleString()+' '+esc(l.currency||''):'';const bt=l.status==='approved'?`<button class="btn sm gh" data-a="pend" data-id="${l.id}">إلغاء النشر</button>`:`<button class="btn sm" data-a="ok" data-id="${l.id}">قبول ونشر</button>`+(l.status==='pending'?`<button class="btn sm no" data-a="no" data-id="${l.id}">رفض</button>`:'');
return `<article class="card"><div class="gal">${(l.photos||[]).map(med).join('')||'<div class="nop">بدون صور</div>'}</div><div class="body"><div class="row1"><b>${esc(l.title)}</b><span class="tag ${esc(l.status)}">${SN[l.status]||l.status}</span></div><p class="meta">${l.kind==='service'?'خدمة':'منتج'} · ${esc(CN[l.cat]||l.cat)}${pr}${l.city?' · '+esc(l.city):''}</p>${l.summary?`<ul class="sm">${l.summary.split(' · ').map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${l.description?`<p class="desc">${esc(l.description)}</p>`:''}${l.reject_reason?`<p class="meta" style="color:var(--no)">سبب الرفض: ${esc(l.reject_reason)}</p>`:''}${who(l)}<div class="acts">${bt}<button class="btn sm gh" data-a="del" data-id="${l.id}">حذف</button></div></div></article>`}
function draw(){nav();const v=$('#v');if(!LS.length&&!Object.keys(PR).length&&view!=='leads'&&v.innerHTML.includes('note'))return;
if(view==='over'){const c=s=>LS.filter(l=>l.status===s).length,us=Object.values(PR),by={};LS.filter(l=>l.status==='approved').forEach(l=>by[l.cat]=(by[l.cat]||0)+1);
v.innerHTML=`<div class="stats"><div class="stat"><span>بانتظار الموافقة</span><b style="color:var(--wa)">${c('pending')}</b></div><div class="stat"><span>منشور</span><b style="color:var(--ok)">${c('approved')}</b></div><div class="stat"><span>مرفوض</span><b>${c('rejected')}</b></div><div class="stat"><span>المستخدمين</span><b>${us.filter(u=>u.role!=='provider').length}</b></div><div class="stat"><span>مقدّمي الخدمات</span><b>${us.filter(u=>u.role==='provider').length}</b></div></div><h3>المنشور في كل قسم</h3>${Object.keys(by).length?`<div class="tw"><table>${Object.keys(by).map(k=>`<tr><td>${esc(CN[k]||k)}</td><td>${by[k]}</td></tr>`).join('')}</table></div>`:'<p class="empty">لسه مفيش إعلانات منشورة.</p>'}`}
else if(view==='pend'){const a=LS.filter(l=>l.status==='pending');v.innerHTML=a.length?`<div class="grid">${a.map(card).join('')}</div>`:'<p class="empty">مفيش حاجة مستنية موافقتك 🎉</p>'}
else if(view==='all'){const a=LS.filter(l=>(fSt==='all'||l.status===fSt)&&(fCat==='all'||l.cat===fCat));v.innerHTML=`<div class="tools"><select id="fs"><option value="all">كل الحالات</option>${Object.keys(SN).map(k=>`<option value="${k}" ${fSt===k?'selected':''}>${SN[k]}</option>`).join('')}</select><select id="fc"><option value="all">كل الأقسام</option>${Object.keys(CN).map(k=>`<option value="${k}" ${fCat===k?'selected':''}>${CN[k]}</option>`).join('')}</select></div>${a.length?`<div class="grid">${a.map(card).join('')}</div>`:'<p class="empty">مفيش نتائج.</p>'}`;$('#fs').onchange=e=>{fSt=e.target.value;draw()};$('#fc').onchange=e=>{fCat=e.target.value;draw()}}
else if(view==='users'){const us=Object.values(PR).filter(u=>fRole==='all'||(fRole==='provider')===(u.role==='provider'));const cnt=id=>{const m=LS.filter(l=>l.owner===id);return m.length?`${m.filter(l=>l.status==='approved').length} منشور / ${m.filter(l=>l.status==='pending').length} مستني`:'—'};
v.innerHTML=`<div class="tools"><select id="fr"><option value="all">الكل</option><option value="provider" ${fRole==='provider'?'selected':''}>مقدّمي الخدمات</option><option value="client" ${fRole==='client'?'selected':''}>المستخدمين</option></select></div>${us.length?`<div class="tw"><table><tr><th>الاسم</th><th>الإيميل</th><th>النوع</th><th>التليفون</th><th>إعلاناته</th><th>انضم</th></tr>${us.map(u=>`<tr><td>${esc(u.full_name||'—')}</td><td>${esc(u.email||'')}</td><td>${u.role==='provider'?'مقدّم خدمة':'مستخدم'}</td><td>${u.phone?`<a target="_blank" href="https://wa.me/${wa(u.phone)}">${esc(u.phone)}</a>`:'—'}</td><td>${cnt(u.id)}</td><td>${esc((u.created_at||'').slice(0,10))}</td></tr>`).join('')}</table></div>`:'<p class="empty">مفيش مستخدمين.</p>'}`;$('#fr').onchange=e=>{fRole=e.target.value;draw()}}
else if(view==='post'){v.innerHTML=`<form id="pf" class="pf card"><div class="body"><p class="meta" style="margin:0">منشور بيظهر فورًا من غير مراجعة. تقدر ترفع صور أو GIF أو فيديو قصير (لحد 12 ميجا).</p><label>النوع<select name="kind"><option value="product">منتج</option><option value="service">خدمة</option></select></label><label>القسم<select name="cat">${Object.keys(CN).map(k=>`<option value="${k}">${CN[k]}</option>`).join('')}</select></label><label>العنوان<input name="title" required maxlength="80"></label><label>الوصف<textarea name="desc" rows="3" maxlength="1500"></textarea></label><label>السعر (اختياري)<input name="price" type="number" min="0" step="any"></label><label>المدينة<input name="city"></label><label>صور / GIF / فيديو<input id="pm" type="file" accept="image/*,video/mp4,video/webm,video/quicktime" multiple></label><div class="pv" id="pv"></div><p class="msg" id="pmsg"></p><button class="btn" id="pgo">نشر</button></div></form>`;
let files=[];const pv=()=>{$('#pv').innerHTML=files.map(f=>f.type.startsWith('video/')?`<video src="${URL.createObjectURL(f)}" muted></video>`:`<img src="${URL.createObjectURL(f)}">`).join('')};
$('#pm').onchange=async e=>{for(const f of e.target.files){if(files.length>=5)break;try{if(f.type.startsWith('video/')){if(f.size>12e6){alert('الفيديو أكبر من 12 ميجا');continue}files.push(f)}else if(f.type==='image/gif'&&f.size<3.5e6)files.push(f);else files.push(await shrink(f))}catch(_){}}pv()};
$('#pf').onsubmit=async e=>{e.preventDefault();const fm=new FormData(e.target),m=$('#pmsg'),go=$('#pgo');m.textContent='';go.disabled=true;go.textContent='…';
try{await sb.from('hz_profiles').upsert({id:me.id,email:me.email});const urls=[];for(let i=0;i<files.length;i++){const bl=files[i],ex=bl.type==='image/gif'?'gif':bl.type==='video/mp4'?'mp4':bl.type==='video/webm'?'webm':bl.type==='video/quicktime'?'mov':'jpg',p=`${me.id}/${Date.now()}_${i}.${ex}`,u=await sb.storage.from('listings').upload(p,bl,{contentType:bl.type||'image/jpeg'});if(u.error)throw u.error;urls.push(sb.storage.from('listings').getPublicUrl(p).data.publicUrl)}
const pr=String(fm.get('price')||'').trim(),r=await sb.from('hz_listings').insert({owner:me.id,kind:fm.get('kind'),cat:fm.get('cat'),title:String(fm.get('title')).trim(),description:String(fm.get('desc')||'').trim(),price:pr===''?null:+pr,currency:'EGP',city:String(fm.get('city')||'').trim(),attrs:{},summary:'',photos:urls,status:'approved'});
if(r.error)throw r.error;await load();view='all';draw()}catch(err){go.disabled=false;go.textContent='نشر';m.textContent=err.message||'حصلت مشكلة'}}}
else{if(leads===null){v.innerHTML='<p class="empty">جاري التحميل…</p>';sb.from('leads').select('*').order('created_at',{ascending:false}).limit(100).then(r=>{leads=r.error?{err:r.error.message}:r.data;draw()});return}
if(leads.err){v.innerHTML=`<div class="note">مقدرتش أقرا جدول الطلبات القديم (leads). لو اسمه مختلف في Supabase قولّي اسمه وأربطه. (${esc(leads.err)})</div>`;return}
v.innerHTML=leads.length?`<div class="grid">${leads.map(r=>`<article class="card"><div class="body">${Object.keys(r).filter(k=>r[k]!=null&&r[k]!==''&&k!=='id').map(k=>`<div class="meta"><b>${esc(k)}:</b> ${esc(typeof r[k]==='object'?JSON.stringify(r[k]):r[k])}</div>`).join('')}</div></article>`).join('')}</div>`:'<p class="empty">مفيش طلبات.</p>'}}
document.addEventListener('click',async e=>{const n=e.target.closest('[data-v]');if(n){view=n.dataset.v;draw();return}
const b=e.target.closest('[data-a]');if(!b)return;const id=b.dataset.id,a=b.dataset.a;let r;
if(a==='ok')r=await sb.from('hz_listings').update({status:'approved',reject_reason:null}).eq('id',id);
else if(a==='pend')r=await sb.from('hz_listings').update({status:'pending'}).eq('id',id);
else if(a==='no'){const why=prompt('سبب الرفض (هيظهر للعميل):');if(why===null)return;r=await sb.from('hz_listings').update({status:'rejected',reject_reason:why||'غير مطابق'}).eq('id',id)}
else if(a==='del'){if(!confirm('تمسح الإعلان نهائي؟'))return;r=await sb.from('hz_listings').delete().eq('id',id)}
if(r&&r.error){alert(r.error.message);return}await load();draw()});
if(sb)sb.auth.getSession().then(({data})=>{if(data.session)enter(data.session.user)});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
